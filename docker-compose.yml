services:
  backend:
    build: ./backend
    ports:
      - "9091:9091"
      - "8081:8081"
    volumes:
      # backend/photos, not ./photos: main.py reads './photos' relative to its
      # working directory, which is /app here and backend/ when app.py starts
      # it on the host (app.py passes cwd=backend). Mounting the repo root's
      # photos/ pointed the container at a different, near-empty folder - the
      # gallery showed one 476-byte leftover instead of the real library, and
      # anything captured in Docker landed where the host run would never look
      # for it. This makes both setups share one library.
      - ./backend/photos:/app/photos
      # Without this, weights fetched via `fetch_wilor.py` (see
      # backend/Dockerfile) live only in the container's writable layer and
      # vanish the next time the image is rebuilt - a ~2.5 GB re-download
      # every rebuild, and a backend that exits at startup until it finishes.
      - wilor_models:/app/wilor_models
      # ViTPose++-Huge is pulled from HuggingFace at import time, not vendored
      # - so without this the ~2.5 GB download repeats on every container
      # recreate (the cache would live in the throwaway writable layer), and
      # more importantly it needs INTERNET AT RUNTIME. At an event with no
      # connection the backend simply never finishes starting. Seed it once:
      #
      #   docker run --rm -v ns-photobooth_hf_cache:/dest       #     -v "$USERPROFILE/.cache/huggingface":/src:ro       #     alpine cp -r /src/. /dest/
      #
      # On a machine with no host cache, leave it empty and the first start
      # downloads into the volume - once, with internet, rather than never.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    # Passes the host GPU through (confirmed working via `docker run --gpus
    # all ... nvidia-smi`) - without this the container's torch install
    # would see no CUDA device and silently fall back to CPU regardless of
    # which torch wheel was installed.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./client-ns-photobooth
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  gallery:
    build: ./gallery
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  wilor_models:
  hf_cache:
