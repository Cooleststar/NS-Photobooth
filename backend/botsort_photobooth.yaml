# BoT-SORT tuned for the photobooth's close-range, multi-person case.
# Copied from ultralytics' botsort.yaml (8.4.90) so the schema matches the
# installed version exactly; only track_buffer, match_thresh, and with_reid
# differ from stock (each explained at its own line below).
#
# Why: when someone stands close enough to fill much of the frame, their box
# grows fast between frames and detection gets marginal at the edges. The
# tracker then fails to associate them with their existing track and issues a
# NEW id. Downstream, a fresh id looks like a brand-new person, so their
# animation slot is freed and reassigned — which is how a clown/pig face ends
# up on somebody else.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25

# 30 -> 90: keep a lost track alive ~3 s at 30 fps instead of ~1 s, so a person
# who blips out at close range reclaims their original id rather than getting
# a new one.
track_buffer: 90

# 0.8 -> 0.9: accept a match down to IoU ~0.1 instead of ~0.2. A box that is
# growing quickly (person walking toward the camera) overlaps its own previous
# frame less, and stock 0.8 drops the association exactly when someone
# approaches — the case being fixed here.
match_thresh: 0.9

fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
# ReID helps further with identity swaps/churn (the "id churn -> duplicate
# owl" bug — see the file header) but it is not free, and it was turned back
# off after measuring rather than reasoning.
#
# Measured on this machine, 3 people in frame, median over 60 calls:
#
#     with_reid: False   11.0 ms
#     with_reid: True    17.0 ms     (+55%)
#
# The cost is per detected person - on an empty frame the two are identical
# (12.0 vs 12.3 ms) - so it grows with exactly the group sizes this booth is
# for. And it lands badly: YOLO runs SYNCHRONOUSLY under _yolo_lock in
# run_pose_detection, unlike WiLoR which hands frames to a worker and drops
# stale ones. Time added here delays the whole pipeline, not just one model's
# update rate.
#
# Note `model: auto` does NOT reuse the detector's features, despite what the
# previous comment here claimed - it downloads yolo26n-cls.pt and runs a
# separate classification network over every box. That is where the cost is.
#
# track_buffer: 90 and match_thresh: 0.9 above were already addressing identity
# churn. Turn this back on only if swaps demonstrably persist with those in
# place, and re-measure with a real group when you do.
with_reid: False
model: auto
